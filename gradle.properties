# Project-wide Gradle settings.

# Increase JVM heap size for the Gradle daemon and force UTF-8 so that
# Turkish and other non-ASCII characters in subtitle files are handled
# consistently across all platforms.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle tasks in parallel and enable the build cache for faster builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with your app's
# APK. https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from the
# library's dependencies, thereby reducing the size of the R class for that
# library.
android.nonTransitiveRClass=true
